[project]
name = "langchain-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Animesh Bala Ani", email = "animesh.ani@live.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.4",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.2",
    "langgraph>=1.2.10",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
langchain-learning = "langchain_learning:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
